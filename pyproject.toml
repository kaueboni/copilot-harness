[project]
name = "radar-consumidor"
version = "0.1.0"
description = "Radar Consumidor - pipeline de ingestao e curadoria de dados do Consumidor.gov.br"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = [".github", ".agents", ".specs", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
